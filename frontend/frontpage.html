<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eee5d5">
  <title>AI Mini Project</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #211f1b;
      background: #171715;
      font-family: Georgia, "Times New Roman", serif;
    }
    .presented-by {
    margin-top: 25px;
    max-width: 600px;
}

.presented-by h3 {
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    color: #25231f;
}

.presented-by p {
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.8;
    color: #514b41;
    margin: 0;
}
    .cover {
      position: relative;
      isolation: isolate;
      width: min(1440px, 100%);
      min-height: min(820px, calc(100vh - 48px));
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.75), transparent 42%),
        linear-gradient(115deg, #f4ecdf 0%, #eee5d5 58%, #e4d8c5 100%);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.28);
    }
    .cover::before {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(48,44,37,.42);
      pointer-events: none;
      z-index: 3;
    }
    .cover::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(48,44,37,.13);
      pointer-events: none;
      z-index: 3;
    }
    .copy {
      z-index: 2;
      align-self: center;
      padding: clamp(42px, 6vw, 92px);
      padding-right: clamp(18px, 3vw, 42px);
    }
    .eyebrow {
      margin: 0 0 28px;
      font: 800 clamp(17px, 2vw, 25px)/1.1 Arial, sans-serif;
      letter-spacing: -.7px;
    }
    h1 {
      max-width: 760px;
      margin: 0;
      font: 900 clamp(48px, 7.3vw, 104px)/.91 Impact, "Arial Narrow", "Franklin Gothic Condensed", sans-serif;
      letter-spacing: -3px;
      text-transform: uppercase;
      text-wrap: balance;
    }
    h1 span { display: block; }
    .subtitle {
      max-width: 650px;
      margin: 38px 0 0;
      padding-top: 22px;
      border-top: 3px solid #302d27;
      font: 700 clamp(18px, 2.25vw, 29px)/1.25 Arial, sans-serif;
      letter-spacing: -.8px;
    }
    .art {
      position: relative;
      min-height: 560px;
      align-self: stretch;
      overflow: hidden;
    }
    .art img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 48% center;
      filter: sepia(.18) contrast(1.04);
      mix-blend-mode: multiply;
    }
    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #eee5d5 0%, rgba(238,229,213,.18) 19%, transparent 42%);
      pointer-events: none;
    }
    .page-number {
      position: absolute;
      right: 42px;
      bottom: 34px;
      z-index: 4;
      color: #38342d;
      font: 700 15px/1 Arial, sans-serif;
      letter-spacing: 2px;
    }
    .enter {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 34px;
      padding: 13px 19px;
      color: #f4ecdf;
      background: #25231f;
      border: 1px solid #25231f;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font: 700 12px/1 Arial, sans-serif;
      transition: background .2s, color .2s, transform .2s;
    }
    .enter:hover {
      color: #25231f;
      background: transparent;
      transform: translateY(-2px);
    }
    .enter:focus-visible { outline: 3px solid #8d7654; outline-offset: 4px; }
    @media (max-width: 760px) {
      body { padding: 0; }
      .cover {
        min-height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: auto 42vh;
      }
      .copy { padding: 62px 34px 28px; }
      .eyebrow { margin-bottom: 20px; }
      h1 { font-size: clamp(48px, 13vw, 78px); letter-spacing: -2px; }
      .subtitle { margin-top: 25px; padding-top: 15px; }
      .art { min-height: 0; }
      .art img { object-position: center 44%; }
      .art::after { background: linear-gradient(180deg, #eee5d5 0%, transparent 28%); }
      .page-number { right: 30px; bottom: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
